<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读辅助 · 专注阅读器</title>
<style>
  :root{
    --bg:#fff; --fg:#1a1a1a; --fg-dim:#5f5f5f; --muted:#626262; --accent:#1f6feb;
    --focus-border:#CC6437; --focus-fill:#FFF2E9; --em-fg:#A8431F;
    --skim-border:#9CABB8; --skip-border:#D7DDE3;
    --hl-bg:#fff3cd; --hl-border:#a87500; --control-bg:#f6f8fa;
    --reader-font-size:18px; --reader-line-height:1.7;
    --body-max-width:36em; --header-height:64px;
    --bottom-gap:calc(32px + env(safe-area-inset-bottom,0px));
  }
  [data-theme="dark"]{
    --bg:#1e1e1e; --fg:#e6e6e6; --fg-dim:#a3a3a3; --muted:#aaa; --accent:#82bfff;
    --focus-border:#E48A5F; --focus-fill:#3A2A1E; --em-fg:#FFAB84;
    --skim-border:#718895; --skip-border:#555;
    --hl-bg:#5A4718; --hl-border:#D8A928; --control-bg:#2a2a2a;
  }
  [data-theme="sepia"]{
    --bg:#f4ecd8; --fg:#2e2a20; --fg-dim:#665d4e; --muted:#625846; --accent:#75500b;
    --focus-border:#9D5B35; --focus-fill:#EFE0C8; --em-fg:#75401F;
    --skim-border:#8F9B9B; --skip-border:#C1B5A0;
    --hl-bg:#E8D9A8; --hl-border:#856300; --control-bg:#EDE0C8;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  html{scroll-padding-bottom:var(--bottom-gap)}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--muted);padding:8px 12px;z-index:10}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .toolbar h1{font-size:1em;margin:0 8px 0 0;white-space:nowrap}
  .toolbar .spacer{flex:1 1 100%;height:0}
  .toolbar label{font-size:.8em;display:inline-flex;align-items:center;gap:4px}
  .tbtn,.toolbar select{font-size:.85em;min-height:44px;min-width:44px;padding:6px 12px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;line-height:1.2}
  .tbtn:hover,.toolbar select:hover{border-color:var(--accent)}
  .tbtn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .tbtn:disabled{opacity:.4;cursor:default}
  .progress{height:4px;background:var(--control-bg);border-radius:2px;overflow:hidden;margin-top:8px}
  .progress>div{height:100%;width:0;background:var(--accent);transition:width .15s}
  .help{font-size:.78em;color:var(--muted);margin:6px 0 0}
  main{max-width:760px;margin:0 auto;padding:18px 14px var(--bottom-gap);font-size:var(--reader-font-size);line-height:var(--reader-line-height)}
  /* 连续视觉区域：统一强度填充，区域起点留 10px；边框自然收口，无卡片外框或阴影。 */
  .region{margin:10px 0 18px;border-left:3px solid transparent;border-radius:3px}
  .region[data-pri="精读"]{border-left-color:var(--focus-border)}
  .region[data-pri="速览"]{border-left:2px solid var(--skim-border)}
  .region[data-pri="跳读"]{border-left:2px dashed var(--skip-border)}
  .block{margin:0;padding:10px 12px 10px 10px;max-width:var(--body-max-width);color:var(--fg);font-size:var(--reader-font-size);line-height:var(--reader-line-height);overflow-wrap:anywhere;transition:color .15s,background-color .15s}
  .block.structural{background:transparent;border:0;padding:6px 0;color:var(--fg)}
  .heading{margin:18px 0 10px;padding:0;border:0;background:transparent;color:var(--fg);font-weight:700;line-height:1.4}
  h1.heading{font-size:calc(var(--reader-font-size)*1.4);margin-top:8px}
  h2.heading{font-size:calc(var(--reader-font-size)*1.3);margin-top:18px}
  h3.heading{font-size:calc(var(--reader-font-size)*1.15);margin-top:16px}
  h4.heading,h5.heading,h6.heading{font-size:calc(var(--reader-font-size)*1.08);margin-top:14px}
  .block.para-start{margin-top:10px}
  .region>.block:first-child{margin-top:0;border-top-left-radius:3px}
  .region>.block:last-child{border-bottom-left-radius:3px}
  .region[data-pri="精读"] .block{background:var(--focus-fill)}
  /* 速览是清晰基准态：不删减、不染色、不降低透明度，仅以行长和间距辅助排版。 */
  .region[data-pri="速览"] .block{padding-top:15px;padding-bottom:15px;padding-left:11px;font-weight:400;background:transparent}
  .skip-fold .block{padding-left:11px;background:transparent}
  .block strong{font-weight:700;color:inherit}
  .block[data-pri="精读"] strong{color:var(--em-fg)}
  .sent{padding:1px 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:calc(var(--header-height) + 8px);scroll-margin-bottom:var(--bottom-gap)}
  .sent.hl-on{cursor:pointer}
  .sent.hl-on:hover:not(.active){background:var(--control-bg)}
  .sent.active,.sent.hl-on.active{background:var(--hl-bg);box-shadow:inset 2px 0 0 var(--hl-border);-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .block.dimmed,.original-block.dimmed{color:var(--fg-dim)}
  body.focus-active #original-full{color:var(--fg-dim)}
  body.focus-active #original-full .sent.active{color:var(--fg)}
  .block.dimmed strong{color:inherit}
  /* 聚焦期间静态块级填充让位；边框和局部加粗仍保留。 */
  body.focus-active .region[data-pri] .block{background:transparent}
  body.focus-active .skip-fold{background:transparent}
  /* 跳读：无填充、低对比虚线弱边；识别靠预览与折叠行为，不靠灰底。 */
  .skip-fold{margin:0 0 18px;background:transparent;border-left:2px dashed var(--skip-border);color:var(--fg)}
  .skip-fold>summary{cursor:pointer;list-style:none;min-height:44px;padding:10px 12px 10px 11px;display:flex;gap:10px;align-items:baseline;font-size:var(--reader-font-size);line-height:var(--reader-line-height)}
  .skip-fold>summary::-webkit-details-marker{display:none}
  .skip-preview{color:var(--muted);flex:1}
  .skip-action{flex:none;color:var(--muted);font-size:.78em;white-space:nowrap}
  .skip-fold .block{background:transparent}
  .origtext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--reader-font-size);line-height:var(--reader-line-height);max-width:none;font-weight:400;background:transparent}
  #original-full,#original-full .original-block{margin:0;padding:0;border:0;border-radius:0;box-shadow:none;color:var(--fg);background:transparent;font:inherit;font-weight:400;text-decoration:none}
  @media(max-width:600px){main{padding:14px 10px var(--bottom-gap)}.toolbar{gap:4px}.toolbar label{font-size:.75em}.skip-fold>summary{flex-wrap:wrap;gap:2px 8px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="toolbar">
    <h1>专注阅读器</h1>
    <label>字号<select id="fs"><option>16</option><option selected>18</option><option>20</option><option>22</option><option>24</option></select></label>
    <label>行距<select id="lh"><option value="1.5">紧凑</option><option selected value="1.7">标准</option><option value="2.0">宽松</option></select></label>
    <label>背景<select id="th"><option selected value="light">白</option><option value="sepia">护眼</option><option value="dark">深色</option></select></label>
    <button class="tbtn" id="hlBtn">高亮：关</button>
    <button class="tbtn" id="origAll">查看原文</button>
    <button class="tbtn" id="expandAll">全部展开</button>
    <div class="spacer"></div>
    <div class="progress"><div id="pbar"></div></div>
    <div class="help">开启高亮后点句聚焦；桌面端可用 ← → 切换可见上下句。</div>
  </div>
</header>
<main id="root"></main>
<script>
const DATA={"title":"标题层级测试","mode":"聚焦阅读","segments":[{"seg_no":1,"original":"文档主标题","sentences":["文档主标题"],"blocks":[{"text":"文档主标题","role":"标题","heading_level":0,"priority":null,"sentences":["文档主标题"],"preview":null}]},{"seg_no":2,"original":"一级章节","sentences":["一级章节"],"blocks":[{"text":"一级章节","role":"标题","heading_level":1,"priority":null,"sentences":["一级章节"],"preview":null}]},{"seg_no":3,"original":"二级章节","sentences":["二级章节"],"blocks":[{"text":"二级章节","role":"标题","heading_level":2,"priority":null,"sentences":["二级章节"],"preview":null}]},{"seg_no":4,"original":"正文一句。","sentences":["正文一句。"],"blocks":[{"text":"正文一句。","role":"核心论点","priority":"精读","sentences":["正文一句。"],"preview":null}]}],"original_text":"文档主标题\n\n一级章节\n\n二级章节\n\n正文一句。","conservative":false};
const root=document.getElementById('root');
const headerEl=document.querySelector('header');
const LS_KEY='reading-accessibility-v232';
const savedState=loadLS();
delete savedState.mode;
let state=Object.assign({fs:'18',lh:'1.7',th:'light',hl:false,view:'assisted',cur:-1,allExpanded:false},savedState);
let sents=[],foldState={};
const entries=[];
DATA.segments.forEach(seg=>(seg.blocks||[]).forEach((block,bi)=>entries.push({segNo:seg.seg_no,block,id:'s'+seg.seg_no+'b'+bi,paraStart:bi===0})));
const originalText=typeof DATA.original_text==='string'?DATA.original_text:DATA.segments.map(s=>s.original||'').join('\n\n');

function loadLS(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return {}}}
function saveLS(){try{localStorage.setItem(LS_KEY,JSON.stringify({fs:state.fs,lh:state.lh,th:state.th,hl:state.hl,view:state.view,cur:state.cur,allExpanded:state.allExpanded}))}catch(e){}}
function hasFoldable(){return entries.some(e=>e.block.priority==='跳读')}
function updateScrollInsets(){
  document.documentElement.style.setProperty('--header-height',Math.ceil(headerEl.getBoundingClientRect().height)+'px');
}
new ResizeObserver(updateScrollInsets).observe(headerEl);
window.addEventListener('resize',updateScrollInsets);
window.addEventListener('orientationchange',()=>setTimeout(updateScrollInsets,120));
function applySettings(){
  document.documentElement.style.setProperty('--reader-font-size',state.fs+'px');
  document.documentElement.style.setProperty('--reader-line-height',state.lh);
  document.documentElement.setAttribute('data-theme',state.th);
  document.getElementById('fs').value=state.fs;document.getElementById('lh').value=state.lh;document.getElementById('th').value=state.th;
  const hb=document.getElementById('hlBtn');hb.textContent='高亮：'+(state.hl?'开':'关');hb.classList.toggle('on',state.hl);
  document.getElementById('origAll').textContent=state.view==='assisted'?'查看原文':'返回辅助';
  syncExpandAll();
}
function syncExpandAll(){
  const b=document.getElementById('expandAll');b.textContent=state.allExpanded?'恢复折叠':'全部展开';
  b.disabled=state.view==='original'||!hasFoldable();
}
function visible(el){return !!(el&&el.getClientRects().length&&!el.closest('details:not([open])'))}
function capturePosition(){
  const candidates=Array.from(document.querySelectorAll('.block,.heading,.original-block')).filter(visible);
  if(!candidates.length)return null;
  const line=(document.querySelector('header')||{getBoundingClientRect:()=>({bottom:0})}).getBoundingClientRect().bottom+8;
  let el=candidates.find(x=>x.getBoundingClientRect().bottom>line)||candidates[candidates.length-1];
  return {id:el.dataset.blockId,top:el.getBoundingClientRect().top};
}
function restorePosition(pos){
  if(!pos||!pos.id)return;
  const el=Array.from(document.querySelectorAll('[data-block-id]')).find(x=>x.dataset.blockId===pos.id&&visible(x));
  if(el){const top=el.getBoundingClientRect().top;window.scrollTo(0,window.scrollY+top-pos.top)}
}
function appendEmphasized(parent,text,offset,emphasis){
  const cuts=new Set([0,text.length]);
  (emphasis||[]).forEach(e=>{const s=Math.max(0,e.start-offset),en=Math.min(text.length,e.end-offset);if(s<text.length&&en>0){cuts.add(Math.max(0,s));cuts.add(Math.min(text.length,en))}});
  const points=Array.from(cuts).sort((a,b)=>a-b);
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1];if(a===b)continue;
    const abs=offset+a;const em=(emphasis||[]).find(e=>abs>=e.start&&abs<e.end);
    if(em){const strong=document.createElement('strong');strong.textContent=text.slice(a,b);strong.dataset.emphasis='true';parent.appendChild(strong)}
    else parent.appendChild(document.createTextNode(text.slice(a,b)));
  }
}
function makeBlock(entry){
  const el=document.createElement('div');const pri=entry.block.priority||'速览';
  el.className='block'+(entry.paraStart?' para-start':'');el.dataset.pri=pri;el.dataset.blockId=entry.id;el.dataset.seg=entry.segNo;
  const text=entry.block.text||'',sentences=entry.block.sentences||[text],em=entry.block.emphasis||[];let cursor=0;
  sentences.forEach((sentence,si)=>{
    let at=text.indexOf(sentence,cursor);if(at<0)at=text.indexOf(sentence);if(at<0)return;
    if(at>cursor)appendEmphasized(el,text.slice(cursor,at),cursor,em);
    const sp=document.createElement('span');sp.className='sent'+(state.hl?' hl-on':'');sp.dataset.sentKey=entry.id+':'+si;
    appendEmphasized(sp,sentence,at,em);el.appendChild(sp);
    const record={el:sp,segNo:entry.segNo,blockEl:el,entry,key:sp.dataset.sentKey};sents.push(record);
    sp.addEventListener('click',ev=>{const sel=window.getSelection?String(window.getSelection()):'';if(sel)return;ev.stopPropagation();if(state.hl)focusAt(sents.findIndex(x=>x.el===sp))});
    cursor=at+sentence.length;
  });
  if(cursor<text.length)appendEmphasized(el,text.slice(cursor),cursor,em);
  return el;
}
function makeSkipGroup(group){
  const det=document.createElement('details');det.className='skip-fold';det.dataset.skipGroup=group[0].id;
  const sum=document.createElement('summary');const pv=document.createElement('span');pv.className='skip-preview';pv.textContent=group[0].block.preview||'以下为'+(group[0].block.role||'补充材料');
  const action=document.createElement('span');action.className='skip-action';sum.appendChild(pv);sum.appendChild(action);det.appendChild(sum);
  group.forEach(e=>det.appendChild(makeBlock(e)));
  det.open=state.allExpanded||foldState[group[0].id]===true;
  const sync=()=>{action.textContent=det.open?'收起原文':'展开原文'};
  sync();det.addEventListener('toggle',()=>{
    foldState[group[0].id]=det.open;sync();
    const folds=Array.from(document.querySelectorAll('.skip-fold'));state.allExpanded=folds.length>0&&folds.every(x=>x.open);syncExpandAll();
    if(state.cur>=0&&sents[state.cur]&&!visible(sents[state.cur].el))clearFocus();saveLS();
  });
  return det;
}
function renderOriginal(){
  const container=document.createElement('div');container.className='origtext';container.id='original-full';let cursor=0;
  entries.forEach(e=>{
    const text=e.block.text||'';let at=originalText.indexOf(text,cursor);if(at<0)at=originalText.indexOf(text);if(at<0)return;
    if(at>cursor)container.appendChild(document.createTextNode(originalText.slice(cursor,at)));
    const span=document.createElement('span');span.className='original-block';span.dataset.blockId=e.id;span.dataset.seg=e.segNo;
    appendOriginalSentences(span,text,e);container.appendChild(span);cursor=at+text.length;
  });
  if(cursor<originalText.length)container.appendChild(document.createTextNode(originalText.slice(cursor)));
  root.appendChild(container);
}
function appendOriginalSentences(parent,text,entry){
  const sentences=entry.block.sentences||[text];let cursor=0,wrote=false;
  sentences.forEach((sentence,si)=>{
    let at=text.indexOf(sentence,cursor);if(at<0)at=text.indexOf(sentence);if(at<0)return;
    if(at>cursor)parent.appendChild(document.createTextNode(text.slice(cursor,at)));
    const sp=document.createElement('span');sp.className='sent'+(state.hl?' hl-on':'');sp.textContent=sentence;sp.dataset.sentKey=entry.id+':o'+si;
    const record={el:sp,segNo:entry.segNo,blockEl:parent,entry,key:sp.dataset.sentKey};sents.push(record);
    sp.addEventListener('click',ev=>{const sel=window.getSelection?String(window.getSelection()):'';if(sel)return;ev.stopPropagation();if(state.hl)focusAt(sents.findIndex(x=>x.el===sp))});
    parent.appendChild(sp);wrote=true;cursor=at+sentence.length;
  });
  if(cursor<text.length)parent.appendChild(document.createTextNode(text.slice(cursor)));
  return wrote;
}
function isHeading(entry){return (entry.block.role==='标题'||entry.block.role==='章节标题'||entry.block.heading_level!=null)&&entry.block.heading_level!=null}
function makeHeading(entry){
  const level=Math.max(0,Math.min(6,entry.block.heading_level));
  const tag=level===0?'h1':level===1?'h2':level===2?'h3':'h'+Math.min(6,level+1);
  const el=document.createElement(tag);el.className='heading';el.dataset.blockId=entry.id;el.dataset.seg=entry.segNo;el.dataset.headingLevel=level;el.textContent=entry.block.text||'';
  return el;
}
function structuralBoundary(entry){return ['标题','章节标题','列表','引文','原文译文对照','对照','表格','分隔符','分隔线'].includes(entry.block.structure||entry.block.role)}
function renderAssisted(){
  let i=0;
  while(i<entries.length){
    if(isHeading(entries[i])){root.appendChild(makeHeading(entries[i]));i++;continue}
    if(structuralBoundary(entries[i])&&!(entries[i].block.priority||'速览')){const el=document.createElement('div');el.className='block structural';el.dataset.pri='';el.dataset.blockId=entries[i].id;el.dataset.seg=entries[i].segNo;el.textContent=entries[i].block.text||'';root.appendChild(el);i++;continue}
    const pri=entries[i].block.priority||'速览';const folded=pri==='跳读';let j=i+1;
    if(folded){while(j<entries.length&&(entries[j].block.priority||'速览')==='跳读'&&entries[j].block.role===entries[i].block.role)j++;root.appendChild(makeSkipGroup(entries.slice(i,j)))}
    else{if(!structuralBoundary(entries[i]))while(j<entries.length&&(entries[j].block.priority||'速览')===pri&&!structuralBoundary(entries[j]))j++;const region=document.createElement('section');region.className='region';region.dataset.pri=pri;entries.slice(i,j).forEach(e=>region.appendChild(makeBlock(e)));root.appendChild(region)}
    i=j;
  }
}
function render(){
  const pos=capturePosition(),focusKey=state.cur>=0&&sents[state.cur]?sents[state.cur].key:null;
  root.innerHTML='';sents=[];
  if(state.view==='original')renderOriginal();else renderAssisted();
  state.cur=focusKey?sents.findIndex(x=>x.key===focusKey&&visible(x.el)):-1;
  applyFocus();updateProgress();applySettings();restorePosition(pos);
}
function applyFocus(){
  document.querySelectorAll('.block,.original-block').forEach(b=>b.classList.remove('dimmed'));document.querySelectorAll('.sent.active').forEach(s=>s.classList.remove('active'));
  const active=state.hl&&state.cur>=0&&sents[state.cur]&&visible(sents[state.cur].el);
  document.body.classList.toggle('focus-active',!!active);
  if(active){const current=sents[state.cur];current.el.classList.add('active');document.querySelectorAll('.block,.original-block').forEach(b=>{if(b!==current.blockEl)b.classList.add('dimmed')})}
}
function clearFocus(){state.cur=-1;applyFocus();updateProgress();saveLS()}
function focusAt(i){
  if(!state.hl||i<0||i>=sents.length||!visible(sents[i].el))return;
  state.cur=i;
  const el=sents[i].el,rect=el.getBoundingClientRect();
  const safeTop=headerEl.getBoundingClientRect().bottom+8;
  const safeBottom=window.innerHeight-8;
  const space=safeBottom-safeTop;
  if(space>0&&(rect.top<safeTop||rect.bottom>safeBottom)){
    const targetTop=Math.max(safeTop,Math.min(safeBottom-Math.min(rect.height,space),(safeTop+safeBottom-rect.height)/2));
    window.scrollBy({top:rect.top-targetTop,behavior:'smooth'});
  }
  applyFocus();updateProgress();saveLS();
}
function updateProgress(){
  document.getElementById('pbar').style.width=(sents.length?((state.cur+1)/sents.length*100):0)+'%';
}
function moveFocus(step){for(let i=state.cur+step;i>=0&&i<sents.length;i+=step){if(visible(sents[i].el)){focusAt(i);return}}}
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='Escape'){if(state.cur>=0)clearFocus();return}if(e.key==='ArrowRight')moveFocus(1);if(e.key==='ArrowLeft')moveFocus(-1)});
document.querySelectorAll('header button,header select').forEach(el=>el.setAttribute('data-control','true'));
function sentenceIndexAt(x,y){
  let pos=null;
  if(document.caretRangeFromPoint)pos=document.caretRangeFromPoint(x,y);
  else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);pos=p?{startContainer:p.offsetNode,startOffset:p.offset}:null}
  if(!pos||pos.startContainer.nodeType!==Node.TEXT_NODE)return -1;
  const sent=pos.startContainer.parentElement?.closest('.sent');
  return sent?sents.findIndex(item=>item.el===sent):-1;
}
function caretTextPos(x,y){
  let pos=null;
  if(document.caretRangeFromPoint)pos=document.caretRangeFromPoint(x,y);
  else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);pos=p?{startContainer:p.offsetNode,startOffset:p.offset}:null}
  return pos&&pos.startContainer.nodeType===Node.TEXT_NODE?pos:null;
}
function charRectAt(pos){
  try{
    const node=pos.startContainer,len=node.nodeValue.length;if(!len)return null;
    const r=document.createRange();
    let a=Math.min(pos.startOffset,len-1);r.setStart(node,a);r.setEnd(node,a+1);
    const rect=r.getBoundingClientRect();
    return rect&&rect.width>=0&&(rect.height>0)?rect:null;
  }catch(e){return null}
}
function pointInRects(el,x,y,pad){
  return Array.from(el.getClientRects()).some(r=>x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad);
}
root.addEventListener('click',ev=>{
  const target=ev.target;
  if(target.closest('.heading,summary,button,select,input,textarea,a,label,[data-control]'))return;
  const x=ev.clientX,y=ev.clientY;
  const sentenceIndex=sentenceIndexAt(x,y);
  if(sentenceIndex>=0){
    if(pointInRects(sents[sentenceIndex].el,x,y,3)){if(state.hl)focusAt(sentenceIndex);return}
  }
  const pos=caretTextPos(x,y);
  if(pos){
    const rect=charRectAt(pos);
    if(rect&&x>=rect.left-2&&x<=rect.right+2&&y>=rect.top-2&&y<=rect.bottom+2)return;
  }
  const selection=window.getSelection?String(window.getSelection()):'';
  if(selection)return;
  if(state.hl&&state.cur>=0)clearFocus();
});
document.getElementById('fs').addEventListener('change',e=>{state.fs=e.target.value;applySettings();saveLS()});
document.getElementById('lh').addEventListener('change',e=>{state.lh=e.target.value;applySettings();saveLS()});
document.getElementById('th').addEventListener('change',e=>{state.th=e.target.value;applySettings();saveLS()});
document.getElementById('hlBtn').addEventListener('click',()=>{state.hl=!state.hl;if(!state.hl)state.cur=-1;applySettings();render();saveLS()});
document.getElementById('origAll').addEventListener('click',()=>{state.view=state.view==='assisted'?'original':'assisted';state.cur=-1;render();saveLS()});
document.getElementById('expandAll').addEventListener('click',()=>{
  const folds=Array.from(document.querySelectorAll('.skip-fold'));if(!folds.length)return;
  const open=!folds.every(x=>x.open);folds.forEach(d=>{d.open=open;foldState[d.dataset.skipGroup]=open});state.allExpanded=open;applySettings();saveLS();
});
applySettings();render();updateScrollInsets();
</script>
</body>
</html>
