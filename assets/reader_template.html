<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读辅助 · 专注阅读器</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --fg-dim:#6a6a6a; --muted:#888; --accent:#1f6feb;
    --pri-focus:#d4502a; --pri-skip:#999;
    --hl-bg:#fff3cd; --hl-border:#e0a800; --fold-bg:#f6f8fa;
    --reader-font-size:18px; --reader-line-height:1.7;
  }
  [data-theme="dark"]{ --bg:#1e1e1e; --fg:#e6e6e6; --fg-dim:#808080; --muted:#777; --accent:#6cb6ff; --pri-focus:#ff6b3d; --pri-skip:#666; --hl-bg:#3a3a1a; --hl-border:#ffc107; --fold-bg:#2a2a2a; }
  [data-theme="sepia"]{ --bg:#f4ecd8; --fg:#2e2a20; --fg-dim:#7a7060; --muted:#6f6450; --accent:#8a5a00; --pri-focus:#8a5a00; --pri-skip:#7a6f5c; --hl-bg:#e8d9a8; --hl-border:#b8860b; --fold-bg:#ede0c8; }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--muted);padding:8px 12px;z-index:10;}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .toolbar h1{font-size:1em;margin:0 8px 0 0;font-weight:bold;white-space:nowrap;}
  .toolbar .spacer{flex:1 1 100%;height:0;}
  .toolbar label{font-size:.8em;display:inline-flex;align-items:center;gap:4px;}
  .tbtn,.toolbar select{font-size:.85em;min-height:44px;min-width:44px;padding:6px 12px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;line-height:1.2;}
  .tbtn:hover,.toolbar select:hover{border-color:var(--accent);}
  .tbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tbtn:disabled{opacity:.4;cursor:default;}
  .progress{height:4px;background:var(--fold-bg);border-radius:2px;overflow:hidden;margin-top:8px;}
  .progress>div{height:100%;width:0;background:var(--accent);transition:width .15s;}
  .help{font-size:.78em;color:var(--muted);margin:6px 0 0;}
  main{max-width:760px;margin:0 auto;padding:18px 14px 90px;}
  /* 语义块：视觉分层，无标签 */
  .block{margin:0 0 14px;font-size:var(--reader-font-size);line-height:var(--reader-line-height);transition:color .15s;}
  .block[data-pri="精读"]{border-left:3px solid var(--pri-focus);padding-left:10px;}
  .block[data-pri="速览"]{color:var(--fg);}
  .block[data-pri="跳读"],.block[data-pri=null]{}
  .block.dimmed{color:var(--fg-dim);}
  .block .sent{cursor:text;padding:1px 2px;border-radius:2px;}
  .block .sent.hl-on{cursor:pointer;}
  .block .sent.hl-on:hover{background:var(--fold-bg);}
  .block .sent.active{background:var(--hl-bg);box-shadow:inset 2px 0 0 var(--hl-border);outline:none;}
  .origtext{white-space:pre-wrap;font-size:var(--reader-font-size);line-height:var(--reader-line-height);}
  /* 跳读折叠 */
  .skip-fold{margin:0 0 14px;}
  .skip-fold>summary{cursor:pointer;color:var(--pri-skip);font-size:.92em;list-style:none;min-height:44px;display:flex;align-items:center;padding:4px 0;}
  .skip-fold>summary::before{content:"▸ 展开原文 ";margin-right:4px;font-size:.85em;}
  .skip-fold[open]>summary::before{content:"▾ 收起 ";}
  .skip-preview{color:var(--muted);font-size:.92em;margin-bottom:4px;}
  /* 原文/辅助切换 */
  .segfoot{margin-top:4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .segfoot button{font-size:.78em;min-height:36px;padding:4px 10px;border:1px solid var(--muted);background:var(--bg);color:var(--muted);border-radius:5px;cursor:pointer;}
  .segfoot button:hover{color:var(--accent);border-color:var(--accent);}
  .seg{margin:0 0 20px;}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--muted);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.82em;color:var(--muted);z-index:10;}
  footer button{font-size:.85em;min-height:44px;min-width:44px;padding:6px 14px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;}
  @media(max-width:600px){ main{padding:14px 10px 90px;} .toolbar{gap:4px;} .toolbar label{font-size:.75em;} }
  @media(prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>
<header>
  <div class="toolbar">
    <h1>专注阅读器</h1>
    <label>字号<select id="fs"><option>16</option><option selected>18</option><option>20</option><option>22</option><option>24</option></select></label>
    <label>行距<select id="lh"><option value="1.5">紧凑</option><option selected value="1.7">标准</option><option value="2.0">宽松</option></select></label>
    <label>背景<select id="th"><option selected value="light">白</option><option value="sepia">护眼</option><option value="dark">深色</option></select></label>
    <button class="tbtn" id="modeBtn">模式：聚焦</button>
    <button class="tbtn" id="hlBtn">高亮：关</button>
    <button class="tbtn" id="origAll">辅助版</button>
    <button class="tbtn" id="expandAll">全部展开</button>
    <div class="spacer"></div>
    <div class="progress"><div id="pbar"></div></div>
    <div class="help">提示：开启高亮后点句聚焦，← → 切换上下句。</div>
  </div>
</header>
<main id="root"></main>
<footer>
  <span id="pos">未开始</span>
  <span><button id="prev">← 上一句</button> <button id="next">下一句 →</button></span>
</footer>
<script>
const DATA = __READER_DATA__;
const root=document.getElementById('root');
const LS_KEY='reading-accessibility';
let state=Object.assign({fs:'18',lh:'1.7',th:'light',mode:DATA.mode||'聚焦阅读',hl:false,view:'assisted',cur:-1,allExpanded:false}, loadLS());
let segView={};
let foldState={};

function loadLS(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};} }
function saveLS(){ try{localStorage.setItem(LS_KEY,JSON.stringify({fs:state.fs,lh:state.lh,th:state.th,mode:state.mode,hl:state.hl,view:state.view,cur:state.cur,allExpanded:state.allExpanded}));}catch(e){} }

function applySettings(){
  document.documentElement.style.setProperty('--reader-font-size',state.fs+'px');
  document.documentElement.style.setProperty('--reader-line-height',state.lh);
  document.documentElement.setAttribute('data-theme',state.th);
  document.getElementById('fs').value=state.fs;
  document.getElementById('lh').value=state.lh;
  document.getElementById('th').value=state.th;
  document.getElementById('modeBtn').textContent='模式：'+state.mode.replace('阅读','');
  const hlB=document.getElementById('hlBtn'); hlB.textContent='高亮：'+(state.hl?'开':'关'); hlB.classList.toggle('on',state.hl);
  document.getElementById('origAll').textContent=state.view==='assisted'?'辅助版':'原文版';
  const eb=document.getElementById('expandAll');
  eb.textContent=state.allExpanded?'恢复折叠':'全部展开';
  eb.disabled=!hasFoldable();
}

function hasFoldable(){
  return DATA.segments.some(seg=>seg.blocks&&seg.blocks.some(b=>b.priority==='跳读'));
}

let sents=[];
function render(){
  const scrollTop=window.scrollY;
  root.innerHTML=''; sents=[];
  DATA.segments.forEach(seg=>{
    const d=document.createElement('div'); d.className='seg'; d.dataset.seg=seg.seg_no;

    const body=document.createElement('div'); body.className='segbody';
    const assisted=document.createElement('div'); assisted.className='assisted';

    const blocks=seg.blocks||[];
    const showOrig = segViewOf(seg.seg_no)==='original';

    if(showOrig){
      const ot=document.createElement('div'); ot.className='origtext'; ot.textContent=seg.original||'';
      assisted.appendChild(ot);
    } else if(blocks.length===0 || DATA.conservative){
      // 保守模式：整段原文
      const b=document.createElement('div'); b.className='block';
      (seg.sentences||[seg.original||'']).forEach(s=>{
        const sp=document.createElement('span'); sp.className='sent'; sp.textContent=s;
        sp.addEventListener('click',()=>{ if(state.hl) focusAt(sents.findIndex(x=>x.el===sp)); });
        b.appendChild(sp); sents.push({el:sp,segNo:seg.seg_no,blockEl:b});
      });
      assisted.appendChild(b);
    } else {
      blocks.forEach((blk,bi)=>{
        const pri=blk.priority;
        // 模式决定可见性
        const isSkip = pri==='跳读';
        const skipFolded = isSkip && state.mode!=='完整阅读' && !state.allExpanded;

        if(isSkip && state.mode!=='完整阅读'){
          // 跳读：预览 + 折叠
          const det=document.createElement('details'); det.className='skip-fold';
          const sum=document.createElement('summary'); sum.textContent='';
          det.appendChild(sum);
          if(blk.preview){
            const pv=document.createElement('div'); pv.className='skip-preview'; pv.textContent=blk.preview;
            det.appendChild(pv);
          }
          const bdiv=document.createElement('div'); bdiv.className='block'; bdiv.dataset.pri=pri||'';
          (blk.sentences||[]).forEach(s=>{
            const sp=document.createElement('span'); sp.className='sent'; sp.textContent=s;
            sp.addEventListener('click',()=>{ if(state.hl) focusAt(sents.findIndex(x=>x.el===sp)); });
            bdiv.appendChild(sp); sents.push({el:sp,segNo:seg.seg_no,blockEl:bdiv});
          });
          det.appendChild(bdiv);
          const fk=seg.seg_no+'-b'+bi;
          det.open=foldState[fk]||state.allExpanded||false;
          det.addEventListener('toggle',()=>{foldState[fk]=det.open;});
          assisted.appendChild(det);
        } else {
          // 精读/速览：直接显示
          const bdiv=document.createElement('div'); bdiv.className='block'; bdiv.dataset.pri=pri||'';
          if(state.mode==='快速浏览' && pri==='速览') bdiv.classList.add('dimmed');
          (blk.sentences||[]).forEach(s=>{
            const sp=document.createElement('span'); sp.className='sent'; sp.textContent=s;
            sp.addEventListener('click',()=>{ if(state.hl) focusAt(sents.findIndex(x=>x.el===sp)); });
            bdiv.appendChild(sp); sents.push({el:sp,segNo:seg.seg_no,blockEl:bdiv});
          });
          assisted.appendChild(bdiv);
        }
      });
    }

    // 原文版（切换时）
    const orig=document.createElement('div'); orig.className='origtext'; orig.textContent=seg.original||'';
    orig.style.display=showOrig?'block':'none';
    assisted.style.display=showOrig?'none':'block';
    body.appendChild(assisted); body.appendChild(orig);
    d.appendChild(body);

    // 单段原文/辅助切换
    const foot=document.createElement('div'); foot.className='segfoot';
    const tog=document.createElement('button'); tog.textContent=showOrig?'返回辅助版':'查看原文';
    tog.addEventListener('click',()=>{ toggleSegView(seg.seg_no); render(); });
    foot.appendChild(tog); d.appendChild(foot);

    root.appendChild(d);
  });
  if(state.cur>=0 && state.cur<sents.length){ sents[state.cur].el.classList.add('active'); }
  applyDimming(); updatePos();
  window.scrollTo(0,scrollTop);
}

function segViewOf(n){ return segView[n]||state.view; }
function toggleSegView(n){ segView[n]= segViewOf(n)==='assisted'?'original':'assisted'; }

function applyDimming(){
  document.querySelectorAll('.block').forEach(b=>b.classList.remove('dimmed'));
  if(state.hl && state.cur>=0 && sents[state.cur]){
    const curBlock=sents[state.cur].blockEl;
    document.querySelectorAll('.block').forEach(b=>{ if(b!==curBlock) b.classList.add('dimmed'); });
  }
}

function focusAt(i){
  if(!state.hl || i<0||i>=sents.length) return;
  const el=sents[i].el;
  if(!el.offsetParent) return; // 跳过不可见
  if(state.cur>=0 && sents[state.cur]) sents[state.cur].el.classList.remove('active');
  state.cur=i; sents[i].el.classList.add('active');
  sents[i].el.scrollIntoView({block:'center',behavior:'smooth'});
  applyDimming(); updatePos(); saveLS();
}
function updatePos(){
  const pbar=document.getElementById('pbar');
  const pct=sents.length?((state.cur+1)/sents.length*100):0;
  pbar.style.width=pct+'%';
  document.getElementById('pos').textContent = state.cur>=0 ? `段 ${sents[state.cur].segNo} · 第 ${state.cur+1}/${sents.length} 句` : '未开始';
}

document.getElementById('next').addEventListener('click',()=>{
  for(let i=state.cur+1;i<sents.length;i++){ if(sents[i].el.offsetParent){ focusAt(i); return; } }
});
document.getElementById('prev').addEventListener('click',()=>{
  for(let i=state.cur-1;i>=0;i--){ if(sents[i].el.offsetParent){ focusAt(i); return; } }
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') document.getElementById('next').click();
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
});
document.getElementById('fs').addEventListener('change',e=>{state.fs=e.target.value;applySettings();saveLS();});
document.getElementById('lh').addEventListener('change',e=>{state.lh=e.target.value;applySettings();saveLS();});
document.getElementById('th').addEventListener('change',e=>{state.th=e.target.value;applySettings();saveLS();});
document.getElementById('hlBtn').addEventListener('click',()=>{
  state.hl=!state.hl;applySettings();
  document.querySelectorAll('.sent').forEach(s=>s.classList.toggle('hl-on',state.hl));
  if(!state.hl){document.querySelectorAll('.sent.active').forEach(s=>s.classList.remove('active'));state.cur=-1;applyDimming();updatePos();}
  saveLS();
});
document.getElementById('origAll').addEventListener('click',()=>{
  state.view=state.view==='assisted'?'original':'assisted';segView={};applySettings();render();saveLS();
});
document.getElementById('modeBtn').addEventListener('click',()=>{
  const ms=['完整阅读','聚焦阅读','快速浏览'];let i=ms.indexOf(state.mode);i=(i+1)%ms.length;state.mode=ms[i];
  applySettings();render();saveLS();
});
document.getElementById('expandAll').addEventListener('click',()=>{
  state.allExpanded=!state.allExpanded;
  document.querySelectorAll('.skip-fold').forEach(d=>d.open=state.allExpanded);
  applySettings();saveLS();
});

applySettings(); render();
</script>
</body>
</html>
